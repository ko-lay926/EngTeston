<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>English Grammar Quiz</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1> English Grammar Quiz</h1>

<!-- NAME SCREEN -->

<div id="name-screen">

<h2>Enter Your Name</h2>

<input type="text"
id="studentName"
placeholder="Your Name">

<button onclick="saveName()">
Continue
</button>

</div>

<!-- MAIN MENU -->

<div id="main-menu" class="hidden">

<button onclick="openWeekMenu()">
 Start Quiz
</button>

<button onclick="showResults()">
 My Results
</button>

<button onclick="showAbout()">
 About
</button>

<!-- Add this button inside MAIN MENU -->
<button onclick="updateQuizzes()">
🔄 Update Weekly Quizzes
</button>

</div>

<!-- WEEK MENU -->

<div id="week-menu" class="hidden">

<h2>Select Week</h2>
<button onclick="openWeek('week1')">
Week 1
</button>

<button onclick="openWeek('week2')">
Week 2
</button>

<button onclick="openWeek('week3')">
Week 3
</button>

<button onclick="openWeek('week4')">
Week 4
</button>
 
<button onclick="openWeek('week5')">
Week 5
</button>

<button onclick="localStorage.removeItem('quizData');location.reload();">
Reset Quizzes
</button>

<button onclick="localStorage.clear();alert('Reset done');">
Reset App Data
</button>

<button onclick="goHome()">
 Back
</button>

</div>

<!-- QUIZ AREA -->

<div id="quiz-box" class="hidden">

<p id="progress"></p>

<h2 id="question"></h2>

<div id="options"></div>

</div>

<!-- RESULT -->

<div id="result" class="hidden">

<h2> Your Score</h2>

<p id="scoreText"></p>

<button onclick="goHome()">
 Main Menu
</button>

</div>

<!-- RESULT HISTORY -->

<div id="history" class="hidden">

<h2> My Results</h2>

<div id="historyList"></div>

<button onclick="exportResults()">
 Export Results
</button>

<button onclick="goHome()">
 Main Menu
</button>

</div>

<!-- ABOUT -->

<div id="about" class="hidden">

<h2> About This App</h2>

<p>

This app helps students practice
basic English grammar offline.

New quizzes will be added weekly.

</p>

<button onclick="goHome()">
 Main Menu
</button>

</div>

</div>

<script>

function showAbout(){

hideAll();

document.getElementById("about")
.classList.remove("hidden");

}

</script>

<script src="app.js"></script>

</body>

</html>

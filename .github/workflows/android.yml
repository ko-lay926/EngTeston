name: Build APK

on:
workflow_dispatch: {}

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '20'

  - name: Show repository contents
    run: |
      echo "Current directory:"
      pwd
      echo ""
      echo "Files:"
      ls -la

  - name: Create package.json if missing
    run: |
      if [ ! -f package.json ]; then
        echo '{"name":"engteston","version":"1.0.0","private":true}' > package.json
      fi

  - name: Install dependencies
    run: |
      npm install
      npm install @capacitor/core @capacitor/cli @capacitor/android --save

  - name: Debug environment
    run: |
      echo "Node:"
      node -v
      echo "NPM:"
      npm -v
      echo "Capacitor:"
      npx cap --version
      echo "Files:"
      ls -la

  - name: Initialize Capacitor
    run: |
      if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
        npx cap init "EngTeston" com.engteston.app --web-dir=.
      fi

  - name: Add Android platform
    run: |
      if [ ! -d android ]; then
        npx cap add android
      fi

  - name: Debug Android folder
    run: |
      ls -la
      ls -la android || true

  - name: Sync Capacitor
    run: npx cap sync android

  - name: Build APK
    run: |
      cd android
      chmod +x gradlew
      ./gradlew assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: engtest-apk
      path: android/app/build/outputs/apk/debug/app-debug.apk
